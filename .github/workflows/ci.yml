name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/zig-0.16.0.tar.xz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output "${archive}" \
            'https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz'
          printf '%s  %s\n' \
            '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' \
            "${archive}" | sha256sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/zig-x86_64-linux-0.16.0" >> "${GITHUB_PATH}"

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon bench examples src tools test

      - name: Run Debug core, process and terminal tests
        run: zig build test -Dterminal-tests=true -Doptimize=Debug --test-timeout 60s -j2

      - name: Run ReleaseSafe core, process and terminal tests
        run: zig build test -Dterminal-tests=true -Doptimize=ReleaseSafe --test-timeout 60s -j2

      - name: Run finite ReleaseSafe compositions
        run: zig build compositions -Doptimize=ReleaseSafe

      - name: Verify generated Unicode data
        run: zig build unicode-check

      - name: Run ReleaseFast benchmark smoke
        run: |
          zig build bench -- text_input 1000
          zig build bench -- graphics_transfer 1000
